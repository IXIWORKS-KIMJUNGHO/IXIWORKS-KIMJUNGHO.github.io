<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif">
  <defs>
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- 배경 -->
  <rect width="660" height="420" rx="12" fill="#111111"/>
  <rect width="660" height="420" rx="12" fill="url(#grid)"/>

  <!-- 상단 라인 -->
  <rect x="0" y="0" width="660" height="2" fill="#333333"/>

  <!-- 제목 -->
  <text x="330" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.3">dist()와 피타고라스 정리</text>
  <text x="330" y="56" text-anchor="middle" fill="#666666" font-size="11" letter-spacing="2" font-weight="400">TWO POINTS → ONE DISTANCE</text>

  <!-- ======= 그리드 보조선 ======= -->
  <g stroke="#ffffff" stroke-width="0.4" opacity="0.06">
    <line x1="70" y1="100" x2="70" y2="320"/>
    <line x1="130" y1="100" x2="130" y2="320"/>
    <line x1="190" y1="100" x2="190" y2="320"/>
    <line x1="250" y1="100" x2="250" y2="320"/>
    <line x1="310" y1="100" x2="310" y2="320"/>
    <line x1="50" y1="320" x2="330" y2="320"/>
    <line x1="50" y1="265" x2="330" y2="265"/>
    <line x1="50" y1="210" x2="330" y2="210"/>
    <line x1="50" y1="155" x2="330" y2="155"/>
    <line x1="50" y1="100" x2="330" y2="100"/>
  </g>

  <!-- ======= 삼각형 ======= -->

  <!-- 면 -->
  <polygon points="70,320 310,320 310,100" fill="#ffffff" fill-opacity="0.03"/>

  <!-- 밑변 -->
  <line x1="70" y1="320" x2="310" y2="320" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>

  <!-- 높이 -->
  <line x1="310" y1="320" x2="310" y2="100" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

  <!-- 빗변 -->
  <line x1="70" y1="320" x2="310" y2="100" stroke="#ffffff" stroke-width="3" opacity="1"/>

  <!-- 직각 기호 -->
  <polyline points="290,320 290,300 310,300" fill="none" stroke="#666666" stroke-width="1"/>

  <!-- 꼭짓점 -->
  <circle cx="70" cy="320" r="4" fill="#ffffff"/>
  <circle cx="310" cy="100" r="4" fill="#ffffff"/>
  <circle cx="310" cy="320" r="3" fill="#666666"/>

  <!-- 좌표 라벨 -->
  <text x="60" y="342" text-anchor="end" fill="#555555" font-size="11">(0, 0)</text>
  <text x="320" y="342" text-anchor="start" fill="#555555" font-size="11">(3, 0)</text>
  <text x="320" y="94" text-anchor="start" fill="#555555" font-size="11">(3, 4)</text>

  <!-- 밑변 라벨 -->
  <rect x="168" y="330" width="44" height="22" rx="4" fill="#222222" stroke="#333333" stroke-width="1"/>
  <text x="190" y="346" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">3</text>

  <!-- 높이 라벨 -->
  <rect x="320" y="198" width="44" height="22" rx="4" fill="#222222" stroke="#333333" stroke-width="1"/>
  <text x="342" y="214" text-anchor="middle" fill="#aaaaaa" font-size="13" font-weight="600">4</text>

  <!-- 빗변 라벨 -->
  <g transform="translate(168, 192) rotate(-42.5)">
    <rect x="-24" y="-14" width="48" height="24" rx="4" fill="#ffffff" fill-opacity="0.1" stroke="#444444" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">5</text>
  </g>

  <!-- ======= 수식 카드 ======= -->

  <rect x="390" y="88" width="240" height="225" rx="8" fill="#181818" stroke="#282828" stroke-width="1"/>

  <!-- 카드 헤더 -->
  <rect x="390" y="88" width="240" height="36" rx="8" fill="#1c1c1c"/>
  <rect x="390" y="112" width="240" height="12" fill="#1c1c1c"/>
  <text x="510" y="112" text-anchor="middle" fill="#555555" font-size="10" font-weight="600" letter-spacing="2">CALCULATION</text>

  <!-- Step 1 -->
  <text x="412" y="152" fill="#666666" font-size="12" font-weight="500">01</text>
  <text x="440" y="152" fill="#999999" font-size="14">가로² = 3² =</text>
  <text x="580" y="152" fill="#ffffff" font-size="14" font-weight="600">9</text>

  <!-- Step 2 -->
  <text x="412" y="182" fill="#666666" font-size="12" font-weight="500">02</text>
  <text x="440" y="182" fill="#999999" font-size="14">세로² = 4² =</text>
  <text x="580" y="182" fill="#ffffff" font-size="14" font-weight="600">16</text>

  <!-- 구분선 -->
  <line x1="412" y1="198" x2="610" y2="198" stroke="#333333" stroke-width="1"/>

  <!-- Step 3 -->
  <text x="412" y="224" fill="#666666" font-size="12" font-weight="500">03</text>
  <text x="440" y="224" fill="#999999" font-size="14">9 + 16 =</text>
  <text x="535" y="224" fill="#ffffff" font-size="14" font-weight="600">25</text>

  <!-- 결과 -->
  <rect x="404" y="245" width="212" height="36" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#444444" stroke-width="1"/>
  <text x="510" y="269" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">√25 = 5</text>

  <!-- ======= 코드 바 ======= -->

  <rect x="36" y="368" width="588" height="38" rx="8" fill="#181818" stroke="#282828" stroke-width="1"/>

  <!-- 터미널 도트 -->
  <circle cx="56" cy="387" r="3.5" fill="#444444"/>
  <circle cx="68" cy="387" r="3.5" fill="#333333"/>
  <circle cx="80" cy="387" r="3.5" fill="#2a2a2a"/>

  <!-- 코드 텍스트 -->
  <text y="392" font-family="'SF Mono', 'Fira Code', 'Menlo', monospace" font-size="14">
    <tspan x="105" fill="#ffffff" font-weight="500">dist</tspan>
    <tspan fill="#555555">(</tspan>
    <tspan fill="#aaaaaa">0</tspan>
    <tspan fill="#555555">, </tspan>
    <tspan fill="#aaaaaa">0</tspan>
    <tspan fill="#555555">, </tspan>
    <tspan fill="#aaaaaa">3</tspan>
    <tspan fill="#555555">, </tspan>
    <tspan fill="#aaaaaa">4</tspan>
    <tspan fill="#555555">)</tspan>
    <tspan fill="#444444">  →  </tspan>
    <tspan fill="#ffffff" font-weight="700">5</tspan>
    <tspan fill="#444444" font-size="12" font-style="italic">   // 두 점 사이의 거리</tspan>
  </text>
</svg>