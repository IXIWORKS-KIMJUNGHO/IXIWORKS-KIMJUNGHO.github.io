<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One dataset transformed into three different outputs</title>
  <desc id="desc">A teaching diagram showing one week of music listening data transformed into a chart, a data poster, and a generative visual system.</desc>
  <rect width="1200" height="680" fill="#fcfcf9"/>
  <g fill="#24424e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" letter-spacing="2">
    <text x="62" y="62">INPUT / LISTENING MINUTES</text>
    <text x="430" y="62">OUTPUT 01</text><text x="706" y="62">OUTPUT 02</text><text x="982" y="62">OUTPUT 03</text>
  </g>
  <g transform="translate(62 118)">
    <rect width="290" height="446" rx="6" fill="#e8ece9" stroke="#132c36" stroke-width="3"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#132c36">
      <text x="28" y="54">MON</text><text x="28" y="108">TUE</text><text x="28" y="162">WED</text><text x="28" y="216">THU</text><text x="28" y="270">FRI</text><text x="28" y="324">SAT</text><text x="28" y="378">SUN</text>
      <text x="248" y="54">40</text><text x="248" y="108">70</text><text x="248" y="162">25</text><text x="248" y="216">90</text><text x="248" y="270">55</text><text x="248" y="324">110</text><text x="248" y="378">65</text>
    </g>
    <g stroke="#91aeb4" stroke-width="7">
      <path d="M92 48H165"/><path d="M92 102H190"/><path d="M92 156H150"/><path d="M92 210H205"/><path d="M92 264H178"/><path d="M92 318H218"/><path d="M92 372H185"/>
    </g>
    <text x="28" y="422" fill="#616960" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="16">same values · same order</text>
  </g>
  <g stroke="#d0d8d3" stroke-width="2"><path d="M388 90V595M664 90V595M940 90V595M1138 90V595"/></g>
  <g transform="translate(420 128)">
    <g fill="#24424e"><rect x="12" y="246" width="22" height="80"/><rect x="47" y="186" width="22" height="140"/><rect x="82" y="276" width="22" height="50"/><rect x="117" y="146" width="22" height="180"/><rect x="152" y="216" width="22" height="110"/><rect x="187" y="106" width="22" height="220"/><rect x="222" y="196" width="22" height="130"/></g>
    <path d="M0 326H258M0 86V326" fill="none" stroke="#132c36" stroke-width="3"/>
    <g fill="#616960" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="16"><text x="40" y="370">accurate comparison</text><text x="48" y="398">DATA CHART</text></g>
  </g>
  <g transform="translate(702 122)">
    <rect x="8" width="230" height="356" fill="#e8ece9" stroke="#132c36" stroke-width="3"/>
    <g fill="#24424e"><circle cx="55" cy="66" r="22"/><circle cx="120" cy="62" r="38"/><circle cx="187" cy="72" r="16"/><circle cx="65" cy="154" r="46"/><circle cx="144" cy="155" r="29"/><circle cx="198" cy="146" r="54"/><circle cx="120" cy="271" r="35"/></g>
    <g fill="#616960" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="16"><text x="48" y="398">emphasis · mood</text><text x="58" y="426">DATA POSTER</text></g>
  </g>
  <g transform="translate(970 122)">
    <rect x="8" width="168" height="356" fill="#e8ece9" stroke="#132c36" stroke-width="3"/>
    <g fill="none" stroke="#24424e" stroke-linecap="round"><path d="M29 58C70 20 125 45 157 102S100 180 38 147 60 260 142 206 150 278 116 313" stroke-width="5"/><path d="M38 147C70 120 110 130 103 166S120 185 142 206" stroke-width="3"/></g>
    <g fill="#132c36"><circle cx="29" cy="58" r="9"/><circle cx="90" cy="39" r="16"/><circle cx="157" cy="102" r="11"/><circle cx="38" cy="147" r="20"/><circle cx="103" cy="166" r="13"/><circle cx="142" cy="206" r="25"/><circle cx="116" cy="313" r="14"/></g>
    <g fill="#616960" font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="16"><text x="12" y="398">rules · variation</text><text x="5" y="426">GENERATIVE SYSTEM</text></g>
  </g>
  <g fill="#132c36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18"><text x="62" y="630">ONE DATASET</text><text x="430" y="630">→ PURPOSE CHANGES → RULE CHANGES → MEANING CHANGES</text></g>
</svg>
