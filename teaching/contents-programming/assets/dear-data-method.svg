<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Dear Data method conceptual diagram</title>
  <desc id="desc">A teaching diagram showing personal observations collected over a week, translated through a visual legend, and drawn as a postcard.</desc>
  <rect width="1200" height="680" fill="#fcfcf9"/>
  <g fill="none" stroke="#d0d8d3" stroke-width="2">
    <path d="M64 110H1136M64 570H1136"/>
    <path d="M365 80V600M815 80V600"/>
  </g>
  <g fill="#24424e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" letter-spacing="2">
    <text x="72" y="76">01 / COLLECT</text>
    <text x="405" y="76">02 / ENCODE</text>
    <text x="855" y="76">03 / DRAW</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">
    <g fill="#e8ece9" stroke="#24424e" stroke-width="2">
      <rect x="84" y="144" width="120" height="58"/><rect x="218" y="144" width="120" height="58"/>
      <rect x="84" y="216" width="120" height="58"/><rect x="218" y="216" width="120" height="58"/>
      <rect x="84" y="288" width="120" height="58"/><rect x="218" y="288" width="120" height="58"/>
      <rect x="84" y="360" width="254" height="58"/>
    </g>
    <g fill="#132c36">
      <text x="144" y="179">MON</text><text x="278" y="179">TUE</text>
      <text x="144" y="251">WED</text><text x="278" y="251">THU</text>
      <text x="144" y="323">FRI</text><text x="278" y="323">SAT</text>
      <text x="211" y="395">SUN</text>
    </g>
  </g>
  <g fill="#24424e">
    <circle cx="112" cy="444" r="10"/><circle cx="148" cy="470" r="17"/><circle cx="204" cy="438" r="8"/><circle cx="248" cy="480" r="13"/><circle cx="305" cy="449" r="20"/>
  </g>
  <g font-family="Inter, Apple SD Gothic Neo, sans-serif" font-size="20">
    <g fill="#132c36">
      <circle cx="455" cy="194" r="12"/><text x="486" y="201">one event</text>
      <circle cx="455" cy="266" r="22"/><text x="496" y="273">long duration</text>
      <path d="M438 344H472" stroke="#132c36" stroke-width="5"/><text x="496" y="351">high intensity</text>
      <path d="M438 416H472" stroke="#557985" stroke-width="5"/><text x="496" y="423">positive</text>
      <path d="M438 488H472" stroke="#91aeb4" stroke-width="5"/><text x="496" y="495">neutral</text>
    </g>
  </g>
  <g transform="translate(858 150)">
    <rect width="278" height="360" rx="6" fill="#e8ece9" stroke="#132c36" stroke-width="3"/>
    <g fill="none" stroke-linecap="round">
      <path d="M41 72C84 29 143 43 164 95S221 162 237 91" stroke="#24424e" stroke-width="5"/>
      <path d="M40 184C91 125 150 214 231 150" stroke="#557985" stroke-width="4"/>
      <path d="M49 260C96 209 171 301 232 236" stroke="#91aeb4" stroke-width="5"/>
    </g>
    <g fill="#132c36">
      <circle cx="59" cy="76" r="9"/><circle cx="111" cy="54" r="16"/><circle cx="164" cy="95" r="11"/><circle cx="217" cy="126" r="20"/>
      <circle cx="65" cy="171" r="14"/><circle cx="126" cy="174" r="8"/><circle cx="184" cy="184" r="18"/><circle cx="231" cy="150" r="10"/>
      <circle cx="64" cy="247" r="18"/><circle cx="122" cy="255" r="12"/><circle cx="185" cy="274" r="9"/><circle cx="232" cy="236" r="16"/>
    </g>
    <g stroke="#132c36" stroke-width="2" opacity=".45">
      <path d="M42 320H236M42 332H204M42 344H221"/>
    </g>
  </g>
  <g fill="#132c36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="72" y="632">OBSERVE → RECORD</text>
    <text x="405" y="632">DATA → VISUAL RULE</text>
    <text x="855" y="632">DRAWING + LEGEND</text>
  </g>
</svg>
