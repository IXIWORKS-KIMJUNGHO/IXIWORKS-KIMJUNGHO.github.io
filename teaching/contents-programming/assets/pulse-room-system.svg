    <path d="M20 284H69L83 261L101 313L121 274L137 295H232" fill="none" stroke="#24424e" stroke-width="5" stroke-linejoin="round"/>
    <text x="84" y="329" fill="#616960" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">72 BPM</text>
  </g>
  <g transform="translate(408 144)">
    <rect width="364" height="338" rx="5" fill="#e8ece9" stroke="#132c36" stroke-width="3"/>
    <g fill="#616960" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><text x="26" y="36">RECENT PARTICIPANTS</text></g>
    <g transform="translate(28 67)">
      <g fill="#fcfcf9" stroke="#24424e" stroke-width="2">
        <rect width="308" height="52" rx="4"/><rect y="66" width="308" height="52" rx="4"/><rect y="132" width="308" height="52" rx="4"/><rect y="198" width="308" height="52" rx="4"/>
      </g>
      <g fill="#132c36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14"><text x="14" y="32">NEW</text><text x="14" y="98">02</text><text x="14" y="164">03</text><text x="14" y="230">04</text></g>
