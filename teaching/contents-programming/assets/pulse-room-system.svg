<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Room interaction diagram</title>
  <desc id="desc">A teaching diagram showing a participant's heartbeat detected by a sensor, stored in a queue, and replayed through a room of flashing light bulbs.</desc>
  <rect width="1200" height="680" fill="#fcfcf9"/>
  <g fill="none" stroke="#d0d8d3" stroke-width="2">
    <path d="M64 112H1136M64 566H1136"/>
    <path d="M365 82V598M815 82V598"/>
  </g>
  <g fill="#24424e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" letter-spacing="2">
    <text x="72" y="76">01 / HEARTBEAT</text>
    <text x="405" y="76">02 / RECORD + QUEUE</text>
    <text x="855" y="76">03 / LIGHT RHYTHM</text>
  </g>
  <g transform="translate(82 144)">
    <rect width="252" height="338" rx="5" fill="#e8ece9" stroke="#132c36" stroke-width="3"/>
    <rect x="70" y="48" width="112" height="154" rx="56" fill="#fcfcf9" stroke="#24424e" stroke-width="4"/>
    <circle cx="126" cy="124" r="29" fill="#132c36"/>
