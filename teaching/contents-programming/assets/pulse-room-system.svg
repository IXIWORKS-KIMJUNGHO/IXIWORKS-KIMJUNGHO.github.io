        <path d="M72 93H101L111 78L121 108L134 82L145 93H286"/>
        <path d="M72 159H115L124 145L134 175L147 151L158 159H286"/>
        <path d="M72 225H96L107 207L119 243L132 216L146 225H286"/>
      </g>
    </g>
  </g>
  <g transform="translate(852 144)">
    <rect width="284" height="338" rx="5" fill="#132c36"/>
    <g stroke="#91aeb4" stroke-width="2"><path d="M0 85H284M0 169H284M0 253H284M71 0V338M142 0V338M213 0V338"/></g>
    <g stroke="#f6f8f7" stroke-width="3">
      <path d="M36 20V45M107 20V45M178 20V45M249 20V45M36 104V129M107 104V129M178 104V129M249 104V129M36 188V213M107 188V213M178 188V213M249 188V213M36 272V297M107 272V297M178 272V297M249 272V297"/>
